{% extends "base.html" %}
{% block title %}Log in · DataSure AI{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h1 class="h4 mb-3">Log in</h1>
        <form method="post">
          <div class="mb-3">
            <label class="form-label" for="username">Username or email</label>
            <input class="form-control" id="username" name="username" value="{{ form_username }}" required autofocus>
          </div>
          <div class="mb-3">
            <label class="form-label" for="password">Password</label>
            <input class="form-control" id="password" name="password" type="password" required>
          </div>
          <div class="form-check mb-3">
            <input class="form-check-input" type="checkbox" id="remember" name="remember">
            <label class="form-check-label" for="remember">Remember me</label>
          </div>
          <button class="btn btn-primary w-100" type="submit">Log in</button>
        </form>
        <p class="text-secondary small mt-3 mb-0">No account yet? <a href="{{ url_for('auth.register') }}">Sign up</a></p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
