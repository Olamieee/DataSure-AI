{% extends "base.html" %}
{% block title %}Sign up · DataSure AI{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h1 class="h4 mb-3">Create an account</h1>
        <form method="post">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <div class="mb-3">
            <label class="form-label" for="username">Username</label>
            <input class="form-control" id="username" name="username" value="{{ form_username }}" required autofocus>
            <div class="form-text">3–64 characters: letters, digits, dot, dash or underscore.</div>
          </div>
          <div class="mb-3">
            <label class="form-label" for="email">Email</label>
            <input class="form-control" id="email" name="email" type="email" value="{{ form_email }}" required>
          </div>
          <div class="mb-3">
            <label class="form-label" for="password">Password (min. 8 characters)</label>
            <input class="form-control" id="password" name="password" type="password" minlength="8" required>
          </div>
          <div class="mb-3">
            <label class="form-label" for="confirm_password">Confirm password</label>
            <input class="form-control" id="confirm_password" name="confirm_password" type="password" minlength="8" required>
          </div>
          <button class="btn btn-primary w-100" type="submit">Create account</button>
        </form>
        <p class="text-secondary small mt-3 mb-0">Already registered? <a href="{{ url_for('auth.login') }}">Log in</a></p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
