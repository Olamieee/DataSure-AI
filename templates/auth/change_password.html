{% extends "base.html" %}
{% block title %}Change password · DataSure AI{% endblock %}
{% block content %}
<h1 class="h3 mb-4">Change password</h1>
<div class="card shadow-sm" style="max-width: 480px">
  <div class="card-body p-4">
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3">
        <label class="form-label" for="current_password">Current password</label>
        <input class="form-control" type="password" id="current_password" name="current_password" required autocomplete="current-password">
      </div>
      <div class="mb-3">
        <label class="form-label" for="new_password">New password</label>
        <input class="form-control" type="password" id="new_password" name="new_password" required minlength="8" autocomplete="new-password">
        <div class="form-text">At least 8 characters.</div>
      </div>
      <div class="mb-3">
        <label class="form-label" for="confirm_password">Repeat new password</label>
        <input class="form-control" type="password" id="confirm_password" name="confirm_password" required minlength="8" autocomplete="new-password">
      </div>
      <button class="btn btn-primary" type="submit">Update password</button>
    </form>
  </div>
</div>
<p class="small text-secondary mt-3">Changing your password keeps your other logged-in
  browser sessions active. Log out on devices you no longer use.</p>
{% endblock %}
